services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealer_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d dealer_crm"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      POSTGRES_DB: dealer_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: